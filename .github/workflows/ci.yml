name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Regression tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Shell syntax
        run: bash -n build.sh scripts/test.sh
      - name: Patch whitespace
        run: git diff --check
